<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 16px optical variant of the Echo mark (Fade): three bars snapped to the pixel grid. -->
  <defs>
    <linearGradient id="answer" x1="3" y1="0" x2="8" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4780FF"/>
      <stop offset=".33" stop-color="#A866FF"/>
      <stop offset=".67" stop-color="#FF669E"/>
      <stop offset="1" stop-color="#FFB866"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="#0A0A0A"/>
  <rect x="3" y="3" width="10" height="2.5" rx="1.25" fill="#F5F5F5"/>
  <rect x="3" y="6.75" width="7.5" height="2.5" rx="1.25" fill="#8A8A8A"/>
  <rect x="3" y="10.5" width="5" height="2.5" rx="1.25" fill="url(#answer)"/>
</svg>
